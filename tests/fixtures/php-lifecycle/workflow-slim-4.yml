# Trimmed from slimphp/Slim 4.x .github/workflows/tests.yml, read 2026-11-20.
# Runs 8.6 with --ignore-platform-req=php+, which require.php (~8.5.0 at most) refuses,
# and a nightly include that is not a PHP line.
name: Tests

on: [push, pull_request]

jobs:
  tests:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
        experimental: [false]
        include:
          - php: '8.5'
            analysis: true
          - php: '8.6'
            composer-options: '--ignore-platform-req=php+'
          - php: nightly
            experimental: true
            composer-options: '--ignore-platform-req=php+'
