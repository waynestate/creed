# Trimmed from laravel/framework 13.x .github/workflows/tests.yml, read 2026-11-20.
# Only the job names and strategy blocks are kept. Unquoted versions, two jobs, and an
# exclude that drops one PHPUnit pairing on 8.3, not 8.3 itself.
name: tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:

jobs:
  linux_tests:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]
        phpunit: ['11.5.50', '12.5.8', '13.0.3']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: 8.3
            phpunit: '13.0.3'

    name: PHP ${{ matrix.php }} - PHPUnit ${{ matrix.phpunit }} - ${{ matrix.stability }}

    steps:
      - name: Setup PHP project
        uses: ./.github/actions/setup-php-project
        with:
          php-version: ${{ matrix.php }}

  windows_tests:
    runs-on: windows-2025

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]
        phpunit: ['11.5.50', '12.5.8', '13.0.3']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: 8.3
            phpunit: '13.0.3'

    steps:
      - name: Execute tests
        run: vendor/bin/phpunit --no-coverage
