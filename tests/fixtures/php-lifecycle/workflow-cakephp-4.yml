# Trimmed from cakephp/cakephp 4.x .github/workflows/ci.yml, read 2026-11-20.
# 7.4 and 8.0 in the matrix, an exclude naming a db-type the matrix does not have
# (it removes nothing), and 8.1, 8.2 and 8.5 through include:. No 8.3, 8.4 or 8.6.
name: CI

jobs:
  testsuite:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0']
        db-type: [sqlite, pgsql]
        prefer-lowest: ['']
        exclude:
          - php-version: '7.4'
            db-type: 'mysql'
        include:
          - php-version: '7.4'
            db-type: 'mariadb'
          - php-version: '7.4'
            db-type: 'mysql'
            prefer-lowest: 'prefer-lowest'
          - php-version: '8.1'
            db-type: 'mysql'
          - php-version: '8.2'
            db-type: 'mysql'
          - php-version: '8.5'
            db-type: 'mysql'
