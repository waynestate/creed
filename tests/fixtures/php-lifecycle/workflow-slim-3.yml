# Trimmed from slimphp/Slim 3.x .github/workflows/tests.yml, read 2026-11-20.
# Four-space indents.
name: Tests

on:
    push:
        branches: [3.x]
    pull_request:

jobs:
    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.1', '8.2', '8.3', '8.4', '8.5']
                include:
                    - php: '8.5'
                      coverage: 'xdebug'
