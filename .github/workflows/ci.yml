name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: waynestate/preflight/.github/workflows/php-package.yml@79029cc2300702d0d450c42cc699e12af1b731f8 # 0.1.4
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci

  # The scheduled job re-reads the upstream feeds, rewrites the latest_patch
  # fields in policy/policy.json, and fails the run when the policy was stale.
  # It is check-only and never commits. bin/policy-bot.php run is the
  # committing path, and no job in this workflow runs it yet.
  refresh-patches:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Refresh patches
        run: php bin/refresh-patches.php
      - name: Check for a stale policy
        run: git diff --exit-code policy/policy.json
