# CREED's pipeline, built from the Preflight components on this GitLab.
# Every include is pinned to one Preflight release, 0.4.0. Never use ~latest.
# CREED requires PHP ^8.3, so the test matrix starts at 8.3.
# composer ci is the contract: the same command runs on GitLab and GitHub.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit:
# from Preflight 0.3.0 each component pulls image_prefix/image, and image_prefix defaults to
# the group's proxy, so the image inputs below are plain image names. Prefix them again and
# the pull fails: one proxy per pull, like one creed per believer.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.4.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.4.0
    inputs:
      image: "composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc"
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: current findings: unbounded dev-main constraints; CI files missing in deploy/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.4.0
    inputs:
      image: "php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      allow_failure: true
  # Accessibility: Preflight's a11y component serves site/ and checks every page with axe-core 4.14.0, light and
  # dark, at 320 and 1280 px, plus WCAG 1.4.10 reflow, at WCAG 2.2 AA. Its Playwright image comes from
  # mcr.microsoft.com, which the Dependency Proxy does not front, so it takes no image_prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.4.0
    inputs:
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash (D-072): Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

# The jobs below are CREED's own, not Preflight components, so they name the proxy themselves.
wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# The scheduled job re-reads the upstream feeds, rewrites the latest_patch
# fields in policy/policy.json, and fails the pipeline when the policy was
# stale. It is check-only and never commits. bin/policy-bot.php run is the
# committing path, and the policy-bot job below runs it. This job skips the
# robot's schedule (CREED_JOB=policy-bot), so a robot pipeline runs only the
# robot and today's check-only schedules run only this job.
refresh-patches:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CREED_JOB != "policy-bot"'
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - php bin/refresh-patches.php
    - git diff --exit-code policy/policy.json

# The policy robot (bin/policy-bot.php run) is the committing path. It
# commits the data allowlist on the checked-out main commit and runs
# composer ci in this same job. Green: it pushes the commit straight to main
# with CI_JOB_TOKEN (GitLab starts no new pipeline for a job-token push, and
# this job already ran the gate). Red: it pushes auto/policy-refresh as a
# merge request labeled auto-data for a person to review, and the job fails.
# It runs on the dedicated schedule (the one carrying CREED_JOB=policy-bot)
# and by hand from the web, on the default branch only. GIT_DEPTH "0"
# fetches the full history, because the robot pushes its commit back. The
# single script step checks the masked CREED_BOT_TOKEN variable first (the
# alert issues need it): without it the job prints a notice and exits 0, so
# it stays green until the owner creates the token.
policy-bot:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CREED_JOB == "policy-bot" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script: |
    set -eu
    if [ -z "${CREED_BOT_TOKEN:-}" ]; then echo "CREED_BOT_TOKEN not set; skipping the policy robot"; exit 0; fi
    composer install --no-interaction --no-progress --prefer-dist
    php bin/policy-bot.php run
