# CREED's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.1.0. Never use ~latest.
# CREED requires PHP ^8.3, so the test matrix starts at 8.3.
# composer ci is the contract: the same command runs on GitLab and GitHub.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.1.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.1.0
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: current findings: unbounded dev-main constraints; CI files missing in deploy/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.1.0
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --policy=vendor/waynestate/creed/policy/policy.json --format=codequality
      allow_failure: true

composer-ci:
  image: composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# Runs only from a GitLab CI/CD schedule (CI/CD > Schedules). It re-reads the
# upstream feeds and rewrites the latest_patch fields in policy/policy.json,
# then fails the pipeline if the policy was stale. CI never pushes: a person
# runs the tool and commits the result.
refresh-patches:
  image: composer:2.10.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - php bin/refresh-patches.php
    - git diff --exit-code policy/policy.json
