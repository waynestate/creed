# CREED's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.1.4. Never use ~latest.
# CREED requires PHP ^8.3, so the test matrix starts at 8.3.
# composer ci is the contract: the same command runs on GitLab and GitHub.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.1.4
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.1.4
    inputs:
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc"
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: current findings: unbounded dev-main constraints; CI files missing in deploy/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.1.4
    inputs:
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --policy=vendor/waynestate/creed/policy/policy.json --format=codequality
      allow_failure: true

 
# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache keyed on its lock files,
# so a pipeline downloads only what changed instead of everything, every run.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"

.composer-cache:
  cache:
    key:
      files: [composer.lock, deploy/composer.lock]
      prefix: composer
    paths: [.cache/composer/]

wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=. --policy=deploy/vendor/waynestate/creed/policy/policy.json

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# The scheduled job re-reads the upstream feeds, rewrites the latest_patch
# fields in policy/policy.json, and fails the pipeline when the policy was
# stale. It is check-only and never commits. bin/policy-bot.php run is the
# committing path, and the policy-bot job below runs it. This job skips the
# robot's schedule (CREED_JOB=policy-bot), so a robot pipeline runs only the
# robot and today's check-only schedules run only this job.
refresh-patches:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CREED_JOB != "policy-bot"'
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - php bin/refresh-patches.php
    - git diff --exit-code policy/policy.json

# The policy robot (bin/policy-bot.php run) is the committing path: it
# commits the data allowlist on auto/policy-refresh and pushes it as a
# merge request labeled auto-data, auto-merged for a data-only run. It runs
# on the dedicated schedule (the one carrying CREED_JOB=policy-bot) and by
# hand from the web. GIT_DEPTH "0" fetches the full history, because the
# robot force-pushes its branch. The single script step checks the masked
# CREED_BOT_TOKEN variable first: without it the job prints a notice and
# exits 0, so it stays green until the owner creates the token.
policy-bot:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CREED_JOB == "policy-bot"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script: |
    set -eu
    if [ -z "${CREED_BOT_TOKEN:-}" ]; then echo "CREED_BOT_TOKEN not set; skipping the policy robot"; exit 0; fi
    composer install --no-interaction --no-progress --prefer-dist
    php bin/policy-bot.php run
